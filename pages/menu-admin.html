<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Menu management | P Cube Charcoal Food Den</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/staff.css">
  <link rel="stylesheet" href="/css/order.css">
  <link rel="stylesheet" href="/css/menu-admin.css">
</head>
<body>
  <header class="s-top">
    <div class="s-wrap s-top-inner">
      <span class="s-title">Menu management <span class="s-who" id="who">&nbsp;</span></span>
      <div class="s-actions">
        <a class="btn btn-sm btn-on-dark" href="/staff">Orders</a>
        <button class="btn btn-sm btn-on-dark" id="logout" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="s-wrap s-main">
    <div class="ma-bar">
      <input class="input" id="q" type="search" placeholder="Search items" aria-label="Search items" autocomplete="off">
      <button class="btn" id="add-item" type="button">Add item</button>
      <button class="btn btn-outline" id="add-cat" type="button">Add category</button>
    </div>
    <p class="notice notice-error" id="err" role="alert" hidden></p>
    <section id="list" aria-live="polite"><p class="muted">Loading&hellip;</p></section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/menu-admin.js"></script>
</body>
</html>
