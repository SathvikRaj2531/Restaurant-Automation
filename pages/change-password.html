<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Change password | P Cube Charcoal Food Den</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="auth-wrap">
    <form class="card auth-card" id="form" novalidate>
      <h1>Change password</h1>
      <p class="muted" id="intro">Choose a new password (at least 8 characters).</p>
      <div class="notice notice-error" id="error" role="alert" hidden></div>
      <div class="notice notice-success" id="ok" role="status" hidden>Password changed.</div>
      <div class="field">
        <label for="current">Current password</label>
        <input class="input" id="current" type="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="next">New password</label>
        <input class="input" id="next" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="again">Repeat new password</label>
        <input class="input" id="again" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn-block" id="submit" type="submit">Change password</button>
      <p style="text-align:center"><a href="#" id="back">Back</a> &middot; <a href="#" id="signout">Sign out</a></p>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script>
    const { api } = PC;
    if (!PC.getToken()) location.href = '/staff/login';
    const form = document.getElementById('form');
    const err = document.getElementById('error');
    const ok = document.getElementById('ok');
    const btn = document.getElementById('submit');
    const show = (el, msg) => { err.hidden = true; ok.hidden = true; if (msg) el.textContent = msg; el.hidden = false; };
    const goHome = () => { const home = PC.homeForRole((PC.getUser() || {}).role); location.href = home || '/staff/login'; };

    document.getElementById('back').addEventListener('click', (e) => { e.preventDefault(); goHome(); });
    document.getElementById('signout').addEventListener('click', (e) => { e.preventDefault(); PC.logout(); });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const current = document.getElementById('current').value;
      const next = document.getElementById('next').value;
      if (next !== document.getElementById('again').value) return show(err, 'The new passwords do not match.');
      btn.disabled = true;
      try {
        const res = await api('/api/auth/change-password', { method: 'POST', staff: true, body: { current_password: current, new_password: next } });
        PC.saveSession(PC.getToken(), res.user);
        show(ok);
        setTimeout(goHome, 900);
      } catch (ex) {
        show(err, ex.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
