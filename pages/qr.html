<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Table QR codes | P Cube Charcoal Food Den</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .qr-wrap { max-width: 960px; margin: 0 auto; padding: 1rem 16px 2rem; }
    .qr-bar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .qr-bar h1 { margin: 0; font-size: 1.5rem; }
    .qr-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .qr-card { text-align: center; break-inside: avoid; page-break-inside: avoid; }
    .qr-card h2 { font-size: 1.6rem; margin-bottom: .2rem; }
    .qr-card .qr-img { background: var(--color-surface); padding: .4rem; display: inline-block; }
    .qr-card .qr-img svg { width: 200px; height: 200px; display: block; }
    .qr-url { font-size: .72rem; word-break: break-all; color: var(--color-text-muted); margin: .4rem 0 0; }
    @media print {
      .no-print { display: none !important; }
      body { background: var(--color-surface); }
      .qr-grid { grid-template-columns: repeat(2, 1fr); }
      .card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="qr-wrap">
    <div class="qr-bar">
      <h1>Table QR codes</h1>
      <div class="no-print">
        <a class="btn btn-ghost" href="/staff">Back</a>
        <button class="btn" id="print" type="button">Print</button>
      </div>
    </div>
    <p class="muted no-print">Each QR code is permanent and opens that table's ordering page. Print them and place one on each table.</p>
    <p class="notice notice-error" id="error" role="alert" hidden></p>
    <div class="qr-grid" id="grid"><p class="muted">Loading&hellip;</p></div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    const { h, api } = PC;
    document.getElementById('print').addEventListener('click', () => window.print());
    (async () => {
      await PC.requireStaff(['owner', 'manager']);
      try {
        const { tables } = await api('/api/staff/qr', { staff: true });
        const grid = document.getElementById('grid');
        grid.replaceChildren(...tables.map((t) => {
          const img = h('div', { class: 'qr-img', role: 'img', 'aria-label': 'QR code for table ' + t.number });
          img.innerHTML = t.svg; // SVG generated by our own server from a trusted URL
          return h('div', { class: 'card qr-card' }, h('h2', { text: 'Table ' + t.number }), img,
            h('p', { text: 'Scan to view the menu and order' }), h('p', { class: 'qr-url', text: t.url }));
        }));
      } catch (e) {
        const box = document.getElementById('error');
        box.textContent = e.message;
        box.hidden = false;
        document.getElementById('grid').replaceChildren();
      }
    })();
  </script>
</body>
</html>
