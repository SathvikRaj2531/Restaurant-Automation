<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff sign in | P Cube Charcoal Food Den</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="auth-wrap">
    <form class="card auth-card" id="form" novalidate>
      <h1>Staff sign in</h1>
      <p class="muted">P Cube Charcoal Food Den</p>
      <div class="notice notice-error" id="error" role="alert" hidden></div>
      <div class="notice notice-warning" id="waiter-note" hidden>Waiter screens are not available yet. Please check back after the next update.</div>
      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-block" id="submit" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script>
    const { api, saveSession, homeForRole } = PC;
    const form = document.getElementById('form');
    const err = document.getElementById('error');
    const btn = document.getElementById('submit');

    // Already signed in? Go straight to the right screen.
    (async () => {
      if (!PC.getToken()) return;
      try {
        const { user } = await api('/api/auth/me', { staff: true });
        if (user.must_change_password) return (location.href = '/staff/change-password');
        const home = homeForRole(user.role);
        if (home) location.href = home;
      } catch { /* stay on login */ }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      btn.disabled = true;
      try {
        const { token, user } = await api('/api/auth/login', {
          method: 'POST',
          body: { username: document.getElementById('username').value, password: document.getElementById('password').value },
        });
        saveSession(token, user);
        if (user.must_change_password) return (location.href = '/staff/change-password');
        const home = homeForRole(user.role);
        if (home) return (location.href = home);
        PC.clearSession();
        await fetch('/api/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
        document.getElementById('waiter-note').hidden = false;
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
